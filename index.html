<!DOCTYPE html>
<html>
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.0/howler.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

    <!-- Webpack パブリックパス固定 -->
    <script>
        window.__webpack_public_path__ = "https://<your-username>.github.io/<your-repo>/";
    </script>

    <!-- 1. ランタイムエンジン -->
    <script defer src="https://<your-username>.github.io/<your-repo>/90484b1a6e559a7684a9.runtimechunk~index.js"></script>

    <!-- 2. 必須の依存チャンク群（869, 607, 962, 834, 242） -->
    <script defer src="https://<your-username>.github.io/<your-repo>/90484b1a6e559a7684a9.styles.js"></script>
    <script defer src="https://<your-username>.github.io/<your-repo>/m37b6m.js"></script>
    <script defer src="https://<your-username>.github.io/<your-repo>/962.js"></script>
    <script defer src="https://<your-username>.github.io/<your-repo>/834.js"></script>
    <script defer src="https://<your-username>.github.io/<your-repo>/242.js"></script>

    <!-- 3. メインエントリー（上のチャンクが全て揃って初めて起動する） -->
    <script defer src="https://<your-username>.github.io/<your-repo>/index.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="app_canvas"></div>
    <div id="app_ui"></div>
</body>
</html>
