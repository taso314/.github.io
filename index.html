<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agar.io - Delta Client</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.0/howler.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- ★ Agar.io 公式 UI のクラッシュを完全防止するプロキシ初期化 ★ -->
    <script>
        // 未定義プロパティへの代入や参照を何でも自動で許容する再帰的 Proxy
        function createSafeProxy() {
            const handler = {
                get(target, prop) {
                    if (prop === 'customSkinTokensTotalCount') return 0;
                    if (prop === 'getCustomSkinTokens') return () => 0;
                    if (prop === 'get' || prop === 'has') return (k) => k || true;
                    if (!(prop in target)) {
                        target[prop] = createSafeProxy();
                    }
                    return target[prop];
                },
                set(target, prop, value) {
                    target[prop] = value;
                    return true;
                }
            };
            return new Proxy({}, handler);
        }

        // Agar.io 公式スクリプトが参照する主要なグローバル変数を網羅
        window.MC = window.MC || createSafeProxy();
        window.agario = window.agario || createSafeProxy();
        window.Env = window.Env || createSafeProxy();
        window.agarApp = window.agarApp || createSafeProxy();
        window.master = window.master || createSafeProxy();

        // Webpack パブリックパス
        window.__webpack_public_path__ = "https://<your-username>.github.io/<your-repo>/";
    </script>

    <!-- Webpack ランタイムとメインスクリプト -->
    <script defer="defer" src="https://taso314.github.io/.github.io/90484b1a6e559a7684a9.runtimechunk~index.js"></script>
    <script defer="defer" src="https://taso314.github.io/.github.io/90484b1a6e559a7684a9.styles.js"></script>
    <script defer="defer" src="https://taso314.github.io/.github.io/index.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="app_canvas"></div>
    <div id="app_ui"></div>
</body>
</html>
