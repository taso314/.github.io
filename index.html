<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agar.io - Delta Client</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.0/howler.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- ★ Agar.io 公式 UI のクラッシュを防ぐ初期化ポリフィル ★ -->
    <script>
        window.Env = window.Env || {};
        window.MC = window.MC || {
            API: {
                customSkinTokensTotalCount: 0,
                getCustomSkinTokens: function() { return 0; }
            },
            i18n: {
                get: function(k) { return k; },
                has: function() { return true; }
            }
        };
        window.agario = window.agario || {};
        window.agario.home = window.agario.home || {};
        window.agarApp = window.agarApp || {};

        // Webpack パブリックパス
        window.__webpack_public_path__ = "https://<your-username>.github.io/<your-repo>/";
    </script>

    <!-- Webpack ランタイムとメインスクリプト -->
    <script defer="defer" src="https://taso314.github.io/.github.io/90484b1a6e559a7684a9.runtimechunk~index.js"></script>
    <script defer="defer" src="https://taso314.github.io/.github.io/index.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="app_canvas"></div>
    <div id="app_ui"></div>
</body>
</html>
