<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agar.io - Delta Client</title>
    
    <!-- 外部リソース -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.0/howler.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Webpack パブリックパスの指定のみ残す（Proxyは全削除） -->
    <script>
        window.__webpack_public_path__ = "https://<your-username>.github.io/<your-repo>/";
    </script>

    <!-- Webpack スクリプト群（正規の順序） -->
    <script defer src="90484b1a6e559a7684a9.runtimechunk~index.js"></script>
    <script defer src="90484b1a6e559a7684a9.styles.js"></script>
    <script defer src="index.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="app_canvas"></div>
    <div id="app_ui"></div>
</body>
</html>
